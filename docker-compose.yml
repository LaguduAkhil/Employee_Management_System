version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: employee_db
    environment:
      POSTGRES_USER: ${DB_USER:-emp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-emp_password}
      POSTGRES_DB: ${DB_NAME:-employee_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-emp_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # FastAPI Application
  api:
    build: .
    container_name: employee_api
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-emp_user}:${DB_PASSWORD:-emp_password}@db:5432/${DB_NAME:-employee_db}
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - app_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
    driver: local

networks:
  app_network:
    driver: bridge
